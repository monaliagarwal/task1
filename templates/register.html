{% extends 'base.html' %}

{% block title %}Create Account — PulseFeed{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="brand-badge bg-primary text-white p-2 rounded mb-2 d-inline-block fs-4">PF</span>
                        <h3 class="fw-bold">Join PulseFeed</h3>
                        <p class="text-muted small">Collaborate, publish, and test modern web applications.</p>
                    </div>

                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" id="register-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="reg-username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="reg-username" name="username" placeholder="Choose a username" required>
                        </div>

                        <div class="mb-3">
                            <label for="reg-email" class="form-label fw-semibold">Email address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="reg-email" name="email" placeholder="name@company.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="reg-password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="reg-password" name="password" placeholder="Create a strong password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3" id="register-submit-btn">
                            Create Account
                        </button>

                        <div class="text-center text-muted small">
                            Already registered? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Sign in here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Sign In — PulseFeed{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="brand-badge bg-primary text-white p-2 rounded mb-2 d-inline-block fs-4">PF</span>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted small">Sign in to manage and interact with PulseFeed stories.</p>
                    </div>

                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" id="login-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3" id="login-submit-btn">
                            Sign In
                        </button>

                        <div class="text-center text-muted small">
                            Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Create one</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
